name: HertzCast
options:
  bundleIdPrefix: com.danbutuc
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

schemes:
  HertzCast:
    build:
      targets:
        HertzCast: all
        HertzCastHelper: all
    run:
      config: Debug
    archive:
      config: Release
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    ENABLE_HARDENED_RUNTIME: YES

targets:

  # ── Main App ──────────────────────────────────────────────────────────
  HertzCast:
    type: application
    platform: macOS
    bundleIdPrefix: com.danbutuc
    info:
      path: HertzCast/Info.plist
      properties:
        CFBundleIdentifier: com.danbutuc.hertzcast
        CFBundleName: HertzCast
        CFBundleDisplayName: HertzCast
        CFBundleExecutable: HertzCast
        CFBundleVersion: "4"
        CFBundleShortVersionString: "2.2.3"
        CFBundleIconFile: AppIcon
        NSHighResolutionCapable: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSUserNotificationsUsageDescription: "HertzCast sends notifications when your receiver is turned on or off by a schedule."
        LSApplicationCategoryType: public.app-category.music
        ATSApplicationFontsPath: "."
        LSUIElement: false
        SMPrivilegedExecutables: {}
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: HertzCast/HertzCast.entitlements
    settings:
      base:
        PRODUCT_NAME: HertzCast
        PRODUCT_BUNDLE_IDENTIFIER: com.danbutuc.hertzcast
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: WZHRK74J98
        ENABLE_APP_SANDBOX: YES
        SKIP_INSTALL: NO
        INSTALL_PATH: /Applications
    dependencies:
      - target: HertzCastHelper
        embed: false
        link: false
    postBuildScripts:
      - name: Embed Login Item Helper
        script: |
          set -e
          SRC="${BUILT_PRODUCTS_DIR}/HertzCastHelper.app"
          DEST="${BUILT_PRODUCTS_DIR}/${WRAPPER_NAME}/Contents/Library/LoginItems"
          mkdir -p "$DEST"
          rm -rf "$DEST/HertzCastHelper.app"
          ditto "$SRC" "$DEST/HertzCastHelper.app"
        inputFiles:
          - $(BUILT_PRODUCTS_DIR)/HertzCastHelper.app
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/$(WRAPPER_NAME)/Contents/Library/LoginItems/HertzCastHelper.app
        showEnvVars: false
    sources:
      - path: HertzCast
        excludes:
          - "**/*.entitlements"
          - "**/Info.plist"
    resources:
      - path: HertzCast/Resources
      - path: screenshots/hertz_logo.png
      - path: screenshots/hertz_green.png
      - path: screenshots/hertz_red.png

  # ── Helper (Login Item) ───────────────────────────────────────────────
  HertzCastHelper:
    type: application
    platform: macOS
    bundleIdPrefix: com.danbutuc
    info:
      path: HertzCastHelper/Info.plist
      properties:
        CFBundleIdentifier: com.danbutuc.hertzcast.helper
        CFBundleName: HertzCastHelper
        CFBundleExecutable: HertzCastHelper
        CFBundleVersion: "4"
        CFBundleShortVersionString: "2.2.3"
        LSUIElement: true
        LSBackgroundOnly: true
    entitlements:
      path: HertzCastHelper/HertzCastHelper.entitlements
    settings:
      base:
        PRODUCT_NAME: HertzCastHelper
        PRODUCT_BUNDLE_IDENTIFIER: com.danbutuc.hertzcast.helper
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: WZHRK74J98
        ENABLE_APP_SANDBOX: YES
        SKIP_INSTALL: YES
    sources:
      - path: HertzCastHelper
        excludes:
          - "**/*.entitlements"
          - "**/Info.plist"
